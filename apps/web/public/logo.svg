<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Circular Code Emblem -->
  <g transform="translate(150, 40) scale(2)">
    <!-- Outer Circle Segments -->
    <path d="M 33 24 A 36 36 0 0 0 25 66 A 36 36 0 0 0 42 85" stroke="#52B143" stroke-width="7" stroke-linecap="round"/>
    <path d="M 68 25 A 36 36 0 0 1 75 66 A 36 36 0 0 1 58 85" stroke="#52B143" stroke-width="7" stroke-linecap="round"/>

    <!-- Code Brackets < and > -->
    <path d="M 23 42 L 13 50 L 23 58" stroke="#52B143" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 77 42 L 87 50 L 77 58" stroke="#52B143" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Speed Lines -->
    <path d="M 64 15 L 86 15" stroke="#52B143" stroke-width="6" stroke-linecap="round"/>
    <path d="M 69 23 L 90 23" stroke="#52B143" stroke-width="6" stroke-linecap="round"/>
    <path d="M 74 31 L 94 31" stroke="#52B143" stroke-width="6" stroke-linecap="round"/>

    <!-- Central Lightning Bolt -->
    <path d="M 58 7 L 38 46 L 53 46 L 43 93 L 68 41 L 52 41 Z" fill="#1A3826"/>
  </g>

  <!-- Typography: shaktIQ with no background -->
  <text x="250" y="380" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="82" letter-spacing="-2">
    <tspan fill="#1A3826">shakt</tspan><tspan fill="#52B143">IQ</tspan>
  </text>

  <!-- Subtitle -->
  <text x="250" y="425" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="20" fill="#52B143" letter-spacing="4">
    API INTELLIGENCE
  </text>
</svg>
