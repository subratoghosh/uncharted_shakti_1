<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .bolt { fill: #10B981; }
    .accent { stroke: #52B143; }
    @media (prefers-color-scheme: light) {
      .bolt { fill: #0A382C; }
      .accent { stroke: #52B143; }
    }
    @media (prefers-color-scheme: dark) {
      .bolt { fill: #46E3B7; }
      .accent { stroke: #52B143; }
    }
  </style>
  <!-- Outer Circle Segments -->
  <path class="accent" d="M 33 24 A 36 36 0 0 0 25 66 A 36 36 0 0 0 42 85" stroke-width="7" stroke-linecap="round"/>
  <path class="accent" d="M 68 25 A 36 36 0 0 1 75 66 A 36 36 0 0 1 58 85" stroke-width="7" stroke-linecap="round"/>

  <!-- Code Brackets < and > -->
  <path class="accent" d="M 23 42 L 13 50 L 23 58" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="accent" d="M 77 42 L 87 50 L 77 58" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Speed Lines -->
  <path class="accent" d="M 64 15 L 86 15" stroke-width="6" stroke-linecap="round"/>
  <path class="accent" d="M 69 23 L 90 23" stroke-width="6" stroke-linecap="round"/>
  <path class="accent" d="M 74 31 L 94 31" stroke-width="6" stroke-linecap="round"/>

  <!-- Lightning Bolt -->
  <path class="bolt" d="M 58 7 L 38 46 L 53 46 L 43 93 L 68 41 L 52 41 Z"/>
</svg>
